# Claude Code Tutorial

## CDS DS 595

### Siddharth Mishra-Sharma

[smsharma.io/teaching/ds595-ai4science](https://smsharma.io/teaching/ds595-ai4science.html)

---

# Demo project

[github.com/hannorein/rebound](https://github.com/hannorein/rebound)

.cmd[
.prompt[>] git clone https://github.com/hannorein/rebound.git
]

---

# Install and login

Install:

.cmd[
.prompt[$] npm install -g @anthropic-ai/claude-code
]

Start Claude Code and log in:

.cmd[
.prompt[$] claude
]

---

# Model selection and effort

Switch models:

.cmd[
.prompt[/]model
]

Effort levels control how much the model reasons:

.cmd[
.prompt[/]effort [low|medium|high|max|auto]
]

---

# CLAUDE.md

Project instructions that persist across sessions. Generate an initial one with:

.cmd[
.prompt[/]init
]

---

# Resuming sessions

Resume a previous session:

.cmd[
.prompt[$] claude .flag[--resume]
]

Continue most recent session:

.cmd[
.prompt[$] claude .flag[--continue]
]

---

# Permission modes

Shift + Enter to change permissions.

.small[
| Mode | Behavior |
|---|---|
| **default** | Asks before file writes and shell commands |
| **acceptEdits** | Auto-approves file edits, asks for shell |
| **dontAsk** | Auto-approves (almost) everything |
| **plan** | Read-only — analyzes and comes up with a plan |
]

Can ask Claude to set fine-grained permissions, which live in `.claude/settings.json`:
---

# Skills

A skill is a reusable prompt packaged as a markdown file:

```
~/.claude/skills/my-skill/SKILL.md
```

```markdown
---
name: simulate
description: Set up and run a rebound simulation
user_invocable: true
---

Create a rebound N-body simulation with the given configuration.
Always use SI units. Include visualization with matplotlib.
```

Invoke with:

.cmd[
.prompt[/]simulate
]

---

# Subagents

Claude can spawn **child agents** that work independently:

- Each gets its own context window

- Can restrict which tools they have access to

- Run in parallel for independent tasks

- Results flow back to the parent

Create a subagent with:
.cmd[
.prompt[/]agents
]

---

# Model Context Protocol (MCP)

- MCP lets Claude call **external tools** — databases, APIs, custom scripts — through a standard interface.

- Claude discovers the server's tools automatically and can call them like any built-in tool.

- Designing an MCP server: just ask Claude to do it.

- For a list of available existing MCP servers:

.cmd[
.prompt[/]mcp
]

---

# Context management

**`/compact`** — Summarize the conversation to free up context.

.cmd[
.prompt[/]compact
]

**`/rewind`** — Undo to a previous point in the conversation

.cmd[
.prompt[/]rewind
]

`/usage` — See token usage and context window details.

---

# Memories

Claude remembers things across sessions:

.cmd[
.prompt[>] remember that this project uses CGS units
]

.cmd[
.prompt[/]memory
]

Can also use a local MEMORY.md or CHANGELOG.md file to persist important info and track progress (my preferred method).

---


# Git worktrees

Claude can work in an **isolated copy** of your repo:

.cmd[
.prompt[$] claude .flag[--worktree]
]

(or, just ask Claude to set it up)

---

# GitHub integration

Claude works natively with `gh`:

.cmd[
.prompt[>] create a PR for these changes
]

.cmd[
.prompt[>] look at the comments on PR #42 and address them
]

.cmd[
.prompt[>] check why CI is failing on this branch
]

---

# `/batch` — parallel fan-out

Run the same prompt across many files or configurations:

.cmd[
.prompt[/]batch
]

---

# Cloud sessions

Run Claude Code in the browser (good if you don't need much local context):

.big.center[
[claude.ai/code](https://claude.ai/code)
]

---

# Remote control

Start a session locally or on web, continue from your phone:

.cmd[
.prompt[>] /remote
]

- Push-based: your phone receives updates

- Can approve/deny actions remotely

- Great for long-running tasks

---

# Long-running tasks — Ralph loop

Every time the agent claims to have completed a task, ask it to promise that is really done, if not kick it back into context. Install with `/plugin`.

.cmd[
/ralph-loop  PROMPT [--max-iterations N] [--completion-promise TEXT]
]

    <script src="https://remarkjs.com/downloads/remark-latest.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
    <script>
      var slideshow = remark.create({
        ratio: '16:9',
        highlightStyle: 'github',
        highlightLines: true,
        countIncrementalSlides: false,
        navigation: { scroll: false }
      });

      renderMathInElement(document.body, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ]
      });

      // Annotation system
      (function() {
        const canvas = document.getElementById('annotation-canvas');
        const ctx = canvas.getContext('2d');
        const indicator = document.getElementById('drawing-indicator');

        let isDrawing = false;
        let drawingMode = false;
        let lastX = 0;
        let lastY = 0;
        let currentSlideIdx = 0;
        let canvasDirty = false;

        const annotations = {};

        function setupCanvas() {
          const dpr = window.devicePixelRatio || 1;
          canvas.width = window.innerWidth * dpr;
          canvas.height = window.innerHeight * dpr;
          canvas.style.width = window.innerWidth + 'px';
          canvas.style.height = window.innerHeight + 'px';
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.scale(dpr, dpr);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#c62828';
        }

        function saveAnnotations() {
          if (canvasDirty) {
            annotations[currentSlideIdx] = canvas.toDataURL();
          }
        }

        function restoreAnnotations(slideIdx) {
          const dpr = window.devicePixelRatio || 1;
          canvas.width = window.innerWidth * dpr;
          canvas.height = window.innerHeight * dpr;
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.scale(dpr, dpr);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#c62828';
          canvasDirty = false;

          if (annotations[slideIdx]) {
            const img = new Image();
            const targetSlide = slideIdx;
            img.onload = function() {
              if (currentSlideIdx !== targetSlide) return;
              ctx.setTransform(1, 0, 0, 1, 0, 0);
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              ctx.scale(dpr, dpr);
            };
            img.src = annotations[slideIdx];
          }
        }

        function clearCurrentSlide() {
          const dpr = window.devicePixelRatio || 1;
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.scale(dpr, dpr);
          delete annotations[currentSlideIdx];
          canvasDirty = false;
        }

        function toggleDrawingMode() {
          drawingMode = !drawingMode;
          canvas.classList.toggle('drawing', drawingMode);
          indicator.classList.toggle('visible', drawingMode);
        }

        function getCoords(e) {
          if (e.touches && e.touches.length > 0) {
            return { x: e.touches[0].clientX, y: e.touches[0].clientY };
          }
          return { x: e.clientX, y: e.clientY };
        }

        function startDrawing(e) {
          if (!drawingMode) return;
          isDrawing = true;
          const coords = getCoords(e);
          lastX = coords.x;
          lastY = coords.y;
        }

        function draw(e) {
          if (!isDrawing || !drawingMode) return;
          e.preventDefault();
          const coords = getCoords(e);
          ctx.beginPath();
          ctx.moveTo(lastX, lastY);
          ctx.lineTo(coords.x, coords.y);
          ctx.stroke();
          lastX = coords.x;
          lastY = coords.y;
          canvasDirty = true;
        }

        function stopDrawing() {
          if (isDrawing) {
            isDrawing = false;
            saveAnnotations();
          }
        }

        function onHideSlide(slide) {
          saveAnnotations();
          if (isDrawing) {
            isDrawing = false;
          }
        }

        function onShowSlide(slide) {
          const newSlideIdx = slide ? slide.getSlideIndex() : slideshow.getCurrentSlideIndex();
          currentSlideIdx = newSlideIdx;
          restoreAnnotations(currentSlideIdx);
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        window.addEventListener('resize', function() {
          saveAnnotations();
          setupCanvas();
          restoreAnnotations(currentSlideIdx);
        });

        document.addEventListener('keydown', function(e) {
          if (e.key === 'd' || e.key === 'D') {
            toggleDrawingMode();
            e.stopPropagation();
          } else if ((e.key === 'x' || e.key === 'X') && drawingMode) {
            clearCurrentSlide();
            e.stopPropagation();
          }
        });

        function checkSlideChange() {
          const newIdx = slideshow.getCurrentSlideIndex();
          if (newIdx !== currentSlideIdx) {
            saveAnnotations();
            if (isDrawing) {
              isDrawing = false;
            }
            currentSlideIdx = newIdx;
            restoreAnnotations(currentSlideIdx);
          }
        }

        document.addEventListener('keyup', checkSlideChange);
        document.addEventListener('click', checkSlideChange);
        document.addEventListener('touchend', function(e) {
          setTimeout(checkSlideChange, 50);
        });

        slideshow.on('hideSlide', onHideSlide);
        slideshow.on('showSlide', onShowSlide);

        currentSlideIdx = slideshow.getCurrentSlideIndex();
        setupCanvas();
      })();

    </script>
