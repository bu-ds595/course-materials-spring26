# Final project: Evaluating and improving LLM scientific capabilities

In teams of 2–3: 
- Identify a **scientific capability** that LLMs struggle with
- Build a **rigorous eval** to measure this capability 
- **Fine-tune** a model to improve it

[Instructions PDF](https://bu-ds595.github.io/course-materials-spring26/notes/final-project.pdf)

# Tinker

You'll fine-tune models using [Tinker](https://thinkingmachines.ai/tinker/), a fine-tuning platform from Thinking Machines. Each team gets $100 in API credits.

You upload training data, pick a base model (e.g. Qwen 4B, Llama 8B), and run supervised or RL fine-tuning jobs through a Python API. 

A 500-example SFT run on a 4B model costs ~$0.25, so you have room to iterate.

Sign up: [auth.thinkingmachines.ai/sign-up](https://auth.thinkingmachines.ai/sign-up)

Examples: [Tinker Cookbook](https://github.com/thinking-machines-lab/tinker-cookbook)

# ImageNet

.cols[
.col-1-2[
1.2M labeled images, 1000 categories. A standardized benchmark for image classification.

2012: [Krizhevsky, Sutskever & Hinton](https://proceedings.neurips.cc/paper_files/paper/2012/file/c399862d3b9d6b76c8436e924a68c45b-Paper.pdf) train a CNN on two GPUs (AlexNet). Error drops from 26% to 16%.

Two years later, every competitive entry was a deep network.
]
.col-1-2[
.center.width-100[![ImageNet](figures/imagenet.png)]
]
]

---

# ImageNet is also a hardware story

.cols[
.col-1-2[
ConvNets worked partly because convolutions map well onto GPU architectures. 

GPUs were designed for graphics, but the operations happened to overlap.

"Hardware lottery": which research ideas succeed depends on which operations the available hardware makes fast.

.small.muted[Hooker, [The Hardware Lottery](https://arxiv.org/abs/2009.06489) (2020)]
]
.col-1-2[
.center.width-90[![GPUs go brr](figures/gpus-go-brr.png)]

.small.muted[Fig 1: [brr](https://hazyresearch.stanford.edu/blog/2024-05-12-tk)]
]
]

# The RL bet (mid-2010s)

Mid-2010s: DeepMind and OpenAI both bet heavily on RL.

Documentary (highly recommended!): [The Thinking Game](https://youtu.be/d95J8yzvjbQ?si=6Q7ZTD_FpaU5vV7N&t=872)

# ViT: transformers for vision (2020)

.cols[
.col-1-2[
Dosovitskiy et al. (2020): chop an image into patches, treat each patch as a token, apply a standard transformer.

No convolutions or translation invariance baked in, instead learn spatial structure from data.

With enough data and compute, ViT matched or exceeded the best CNNs.

# GPT-2: zero-shot transfer (2019)

GPT-2 (up to 1.5B params) demonstrated that a language model trained on diverse web text could perform **zero-shot task transfer**: do multiple tasks well without any task-specific data or training.

# Scaling laws

Loss improves as a smooth power law in parameters, tokens, and compute. The return on investment is predictable!

.cols[
.col-1-2[
.center.width-100[![Scaling laws](figures/scaling2.png)]
]
.col-1-2[
$L(N) \propto N^{-0.076}$; $L(D) \propto D^{-0.095}$

Given a fixed compute budget, should you spend it on a bigger model or more data? (more later...)
]
]

.small.muted[Kaplan et al., Scaling Laws for Neural Language Models (2020)]

# The foundation model recipe

.cols[
.col-1-2[
1. **Pre-training**: predict the next token, self-supervised.

2. **Supervised fine-tuning (SFT)**: train on curated (prompt, response) pairs.

3. **RL**: train with RL against a preference model and/or verifiable rewards.
]
.col-1-2[
.center.width-90[![LeCun cake](figures/cake.webp)]

.small.muted[LeCun, NeurIPS 2016 keynote (somewhat outdated)]
]
]

We'll cover these in detail in L22 (pre-training, SFT) and L23 (RL).

# [The Bitter Lesson](http://www.incompleteideas.net/IncIdeas/BitterLesson.html)

> "The biggest lesson that can be read from 70 years of AI research is that general methods that leverage computation are ultimately the most effective, and by a large margin."
>
> — Rich Sutton (2019)

Common misreading: scale is all that matters, algorithms don't.

Better reading: **algorithms that scale are what matter.**

---

# Accuracy = efficiency x resources

Efficiency matters *more* at larger scales, not less. You can't afford to be wasteful when a training run costs millions of dollars. The right framing: given a fixed compute and data budget, what is the best model you can build?

.center.width-50[![Algorithmic efficiency](figures/algorithmic-efficiency.png)]

.small.muted[From [horace.io/brrr\_intro](https://horace.io/brrr_intro.html)]

    <script>
      var slideshow = remark.create({
        ratio: '16:9',
        highlightStyle: 'github',
        highlightLines: true,
        countIncrementalSlides: false,
        navigation: { scroll: false }
      });

      renderMathInElement(document.body, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ]
      });

      // Annotation system
      (function() {
        const canvas = document.getElementById('annotation-canvas');
        const ctx = canvas.getContext('2d');
        const indicator = document.getElementById('drawing-indicator');

        let isDrawing = false;
        let drawingMode = false;
        let lastX = 0;
        let lastY = 0;
        let currentSlideIdx = 0;
        let canvasDirty = false;

        const annotations = {};

        function setupCanvas() {
          const dpr = window.devicePixelRatio || 1;
          canvas.width = window.innerWidth * dpr;
          canvas.height = window.innerHeight * dpr;
          canvas.style.width = window.innerWidth + 'px';
          canvas.style.height = window.innerHeight + 'px';
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.scale(dpr, dpr);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#c62828';
        }

        function saveAnnotations() {
          if (canvasDirty) {
            annotations[currentSlideIdx] = canvas.toDataURL();
          }
        }

        function restoreAnnotations(slideIdx) {
          const dpr = window.devicePixelRatio || 1;
          canvas.width = window.innerWidth * dpr;
          canvas.height = window.innerHeight * dpr;
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.scale(dpr, dpr);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#c62828';
          canvasDirty = false;

          if (annotations[slideIdx]) {
            const img = new Image();
            const targetSlide = slideIdx;
            img.onload = function() {
              if (currentSlideIdx !== targetSlide) return;
              ctx.setTransform(1, 0, 0, 1, 0, 0);
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              ctx.scale(dpr, dpr);
            };
            img.src = annotations[slideIdx];
          }
        }

        function clearCurrentSlide() {
          const dpr = window.devicePixelRatio || 1;
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.scale(dpr, dpr);
          delete annotations[currentSlideIdx];
          canvasDirty = false;
        }

        function toggleDrawingMode() {
          drawingMode = !drawingMode;
          canvas.classList.toggle('drawing', drawingMode);
          indicator.classList.toggle('visible', drawingMode);
        }

        function getCoords(e) {
          if (e.touches && e.touches.length > 0) {
            return { x: e.touches[0].clientX, y: e.touches[0].clientY };
          }
          return { x: e.clientX, y: e.clientY };
        }

        function startDrawing(e) {
          if (!drawingMode) return;
          isDrawing = true;
          const coords = getCoords(e);
          lastX = coords.x;
          lastY = coords.y;
        }

        function draw(e) {
          if (!isDrawing || !drawingMode) return;
          e.preventDefault();
          const coords = getCoords(e);
          ctx.beginPath();
          ctx.moveTo(lastX, lastY);
          ctx.lineTo(coords.x, coords.y);
          ctx.stroke();
          lastX = coords.x;
          lastY = coords.y;
          canvasDirty = true;
        }

        function stopDrawing() {
          if (isDrawing) {
            isDrawing = false;
            saveAnnotations();
          }
        }

        function onHideSlide(slide) {
          saveAnnotations();
          if (isDrawing) {
            isDrawing = false;
          }
        }

        function onShowSlide(slide) {
          const newSlideIdx = slide ? slide.getSlideIndex() : slideshow.getCurrentSlideIndex();
          currentSlideIdx = newSlideIdx;
          restoreAnnotations(currentSlideIdx);
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        window.addEventListener('resize', function() {
          saveAnnotations();
          setupCanvas();
          restoreAnnotations(currentSlideIdx);
        });

        document.addEventListener('keydown', function(e) {
          if (e.key === 'd' || e.key === 'D') {
            toggleDrawingMode();
            e.stopPropagation();
          } else if ((e.key === 'x' || e.key === 'X') && drawingMode) {
            clearCurrentSlide();
            e.stopPropagation();
          }
        });

        function checkSlideChange() {
          const newIdx = slideshow.getCurrentSlideIndex();
          if (newIdx !== currentSlideIdx) {
            saveAnnotations();
            if (isDrawing) {
              isDrawing = false;
            }
            currentSlideIdx = newIdx;
            restoreAnnotations(currentSlideIdx);
          }
        }

        document.addEventListener('keyup', checkSlideChange);
        document.addEventListener('click', checkSlideChange);
        document.addEventListener('touchend', function(e) {
          setTimeout(checkSlideChange, 50);
        });

        slideshow.on('hideSlide', onHideSlide);
        slideshow.on('showSlide', onShowSlide);

        currentSlideIdx = slideshow.getCurrentSlideIndex();
        setupCanvas();
      })();

    </script>
