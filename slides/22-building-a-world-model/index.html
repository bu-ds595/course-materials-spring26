# Transformer inputs: tokenization and embeddings

The model outputs a softmax over a finite vocabulary

.center.width-90[![Tokenization pipeline](figures/tokenization_pipeline.png)]

We need to decide: (a) what are the atomic units of text, and (b) how to represent them?

---

# Character-level

Vocabulary: every printable ASCII character ($V \approx 95$):

```
 !"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~
```

--

Each character becomes a one-hot vector of length $V$:

```
"cat" → ['c', 'a', 't']     (3 tokens)

'c' → [0, 0, ..., 0, 1, 0, ..., 0]   (1 at index 67)
'a' → [0, 0, ..., 1, 0, ..., 0, 0]   (1 at index 65)
't' → [0, 0, ..., 0, 0, 1, ..., 0]   (1 at index 84)
```

--

.green[Pro:] Small vocabulary!

.red[Con:] Sequences become very long. "attention" = 9 tokens, model must learn spelling from scratch.

---

# Word-level

Vocabulary: `{the, cat, sat, attention, ...}`

--

.green[Pro:] Semantically meaningful units. Short sequences.

.red[Con:] Huge vocabulary (every word in the corpus!). Can't handle novel words, typos, code, other languages.

---

# Byte-Pair Encoding (BPE) tokenization
 
Start with characters. Iteratively merge the most frequent pair.

.algorithm[
**BPE in 3 steps:**

1. Start with a character-level vocabulary

2. Count all adjacent pairs in the corpus. Merge the most frequent pair into a new token.

3. Repeat step 2 until vocabulary reaches target size $V$.
]


Common words are single tokens (`the`, `and`), rare words are split into subwords (`un` + `believ` + `able`), and any string can be encoded.

Typical $V$: 32K–128K

---

# BPE example

Corpus with word frequencies: `("hug", 10)  ("pug", 5)  ("pun", 12)  ("bun", 4)  ("hugs", 5)`

Initial vocabulary (all characters in the corpus): `{b, g, h, n, p, s, u}`

Split every word into characters:

```
("h" "u" "g", 10)   ("p" "u" "g", 5)   ("p" "u" "n", 12)
("b" "u" "n", 4)     ("h" "u" "g" "s", 5)
```

---

# BPE example (cont.)

| Pair | Count | Where? |
|------|-------|--------|
| `(u, g)` | **20** | "h **ug**" (10) + "p **ug**" (5) + "h **ug** s" (5) |
| `(h, u)` | 15 | "**hu** g" (10) + "**hu** gs" (5) |
| `(u, n)` | 16 | "p **un**" (12) + "b **un**" (4) |
| `(p, u)` | 17 | "**pu** g" (5) + "**pu** n" (12) |

--

Most frequent: `(u, g)` with 20 occurrences. Merge → new token `ug`.

```
("h" "ug", 10)   ("p" "ug", 5)   ("p" "u" "n", 12)
("b" "u" "n", 4)   ("h" "ug" "s", 5)
```

Vocabulary: `{b, g, h, n, p, s, u, ug}`

---

# BPE example (cont.)

Next most frequent: `(u, n)` at 16. Merge → `un`.

```
("h" "ug", 10)   ("p" "ug", 5)   ("p" "un", 12)
("b" "un", 4)     ("h" "ug" "s", 5)
```

--

Next: `(h, ug)` at 15. Merge → `hug`.

```
("hug", 10)   ("p" "ug", 5)   ("p" "un", 12)
("b" "un", 4)   ("hug" "s", 5)
```

Vocabulary: `{b, g, h, n, p, s, u, ug, un, hug}`

--

Keep going until target $V$ is reached.

# ~Three stages of LLM training

| Stage | Data | Scale | Objective |
|-------|------|-------|-----------|
| **Pre-training** | Web crawl, books, code, papers | ~T tokens | Next-token prediction |
| **Mid-training** | Domain data, long docs, ... | ~B tokens | Next-token prediction |
| **Post-training** | (Prompt, response) pairs; RL environments | ~K–T tokens | SFT loss (next token); RL reward |

We'll use [OLMo 3](https://arxiv.org/abs/2512.13961) as as an example of an open source (not just open weights!) model to show various stages of the training pipeline.

# The pre-training objective

The transformer outputs a hidden state $h\_t \in \mathbb{R}^d$ at each position. Predict the next token:

$$p(x\_{t+1} \mid x\_{\leq t}) = \text{softmax}(W\_{\text{unembed}} \cdot h\_t)$$

Given a sequence of tokens $x\_1, x\_2, \ldots, x\_T$, maximize the log-likelihood:

.highlight[
$$\mathcal{L} = -\sum\_{t=1}^{T} \log p\_\theta(x\_t \mid x\_1, \ldots, x\_{t-1})$$
]

This is just **cross-entropy loss**, applied at every position ($T$ times per sequence).

# A pre-trained model is a text completer (demo)

Pre-training installs **capabilities**: facts, reasoning, code, math, science. The model optimizes for **prediction**, not **helpfulness**.

.center.width-80.shadow[![Base model completion](figures/base_model_completion.png)]

.small.muted[OLMo 3 base model — just completes the pattern, doesn't answer]

SFT bridges this gap: teach the model to express its capabilities in a useful format.

---

# SFT: same loss, different data

$$\mathcal{L}\_{\text{SFT}} = -\sum\_{t} \log p\_\theta(x\_t \mid x\_{\lt t})$$

The only difference: the data is curated (prompt, response) pairs instead of raw web text. Typically, the loss is computed only on the response tokens (the model doesn't need to "predict" the prompt).

--

.col-1-2[

# What makes Think different: the training data

Think models are SFT'd on data with explicit **reasoning traces** — long internal monologues distilled from stronger models (e.g. DeepSeek-R1):

<pre style="background: #1e1e2e; color: #cdd6f4; border-radius: 8px; padding: 0.8em 1.2em; font-size: 0.5em; line-height: 1.4; white-space: pre-wrap;"><span style="color: #f38ba8;">[user]</span> The total in-store price for an appliance is $99.99. A TV ad offers three payments of $29.98 and shipping of $9.98. How many cents are saved?

<span style="color: #fab387;">&lt;|begin_of_thought|&gt;</span>
Okay, let's figure this out step by step. The in-store price is $99.99. The TV ad: three payments of $29.98. So 29.98 * 3. Let me see: 30 * 3 = 90, minus 0.02 * 3 = 0.06, so 90 - 0.06 = 89.94. Then shipping: 89.94 + 9.98. That's 89.94 + 10.00 = 99.94, minus 0.02 = 99.92.

Wait, let me verify in cents. In-store: 9999 cents. TV: 2998 * 3 = 8994, plus 998 = 9992.

So 9999 - 9992 = 7 cents. Answer is B.
<span style="color: #fab387;">&lt;|end_of_thought|&gt;</span>

<span style="color: #a6e3a1;">&lt;|begin_of_solution|&gt;</span>
Three payments: 29.98 × 3 = 89.94. Total: 89.94 + 9.98 = 99.92. Savings: 99.99 - 99.92 = 0.07 = <span style="color: #a6e3a1;">7 cents (B)</span>
<span style="color: #a6e3a1;">&lt;|end_of_solution|&gt;</span></pre>

.small.muted[From `bespokelabs/Bespoke-Stratos-17k` — reasoning traces distilled from DeepSeek-R1]

# Formatting and special tokens

The model sees a flat token stream. Special tokens mark structure (ChatML format):

<pre style="background: #1e1e2e; color: #cdd6f4; border-radius: 8px; padding: 1em 1.2em; font-size: 0.75em; line-height: 1.6;">
<span style="color: #f38ba8;">&lt;|im_start|&gt;</span>system
You are a helpful assistant.<span style="color: #f38ba8;">&lt;|im_end|&gt;</span>
<span style="color: #f38ba8;">&lt;|im_start|&gt;</span>user
What is 2+2?<span style="color: #f38ba8;">&lt;|im_end|&gt;</span>
<span style="color: #f38ba8;">&lt;|im_start|&gt;</span>assistant
<span style="color: #a6e3a1;">4.</span><span style="color: #f38ba8;">&lt;|im_end|&gt;</span>
</pre>

- Special tokens are added to the vocabulary — not composed from characters, just new IDs
- The model learns their meaning entirely from training data
- Different model families use different formats (above is ChatML format)

---

# Examples of special tokens

- <span style="color: #c62828;">**`<im_start>`**</span>, <span style="color: #c62828;">**`<im_end>`**</span> — mark message boundaries (ChatML)
- <span style="color: #c62828;">**`<endoftext>`**</span> — end of sequence / EOS
- <span style="color: #c62828;">**`<pad>`**</span> — padding for batching
- <span style="color: #c62828;">**`<fim_prefix>`**</span>, <span style="color: #c62828;">**`<fim_middle>`**</span>, <span style="color: #c62828;">**`<fim_suffix>`**</span> — fill-in-the-middle (code infilling)

--

**Fill-in-the-middle (FIM):** generate code to fill a gap, not just append.

<pre style="background: #1e1e2e; color: #cdd6f4; border-radius: 8px; padding: 1em 1.2em; font-size: 0.75em; line-height: 1.6;">
<span style="color: #f38ba8;">&lt;|fim_prefix|&gt;</span>def greet(name):
    message = <span style="color: #f38ba8;">&lt;|fim_suffix|&gt;</span>
    return message<span style="color: #f38ba8;">&lt;|fim_middle|&gt;</span><span style="color: #a6e3a1;">f"Hello, {name}!"</span>
</pre>

This is what powers Copilot-style tab completion — condition on code before *and* after the cursor.

# Full fine-tuning is expensive

An 8B parameter model:

| Component | Precision | Size |
|-----------|-----------|------|
| Weights | float16 | 8B × 2 bytes = **16 GB** |
| Gradients | float32 | 8B × 4 bytes = **32 GB** |
| Adam moment 1 | float32 | 8B × 4 bytes = **32 GB** |
| Adam moment 2 | float32 | 8B × 4 bytes = **32 GB** |
| **Total** | | **~112 GB** |

---

# LoRA: Low-Rank Adaptation

Instead of updating all $d^2$ entries of $W$, decompose the update as a product of two small matrices:

.center.width-70[![LoRA decomposition](figures/lora_decomposition.png)]

Freeze $W$. Only train $A$ and $B$: $\;2dr$ params instead of $d^2$.

For $d = 4096$, $r = 16$: $\;16.8\text{M}$ $\to$ $131\text{K}$ per matrix. **128$\times$ reduction.**

.small.muted[Hu et al., [LoRA: Low-Rank Adaptation of Large Language Models](https://arxiv.org/abs/2106.09685) (2021)]

---

# LoRA: forward pass

.center.width-50[![LoRA forward pass](figures/lora_forward.png)]

Input goes through both paths in parallel. The low-rank adapter learns a small correction to the frozen weights. 

The weight updates during fine-tuning are empirically low-rank. Not learning a completely new model, but making a small, structured adjustment to a pre-trained one.

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
    <script>
      var slideshow = remark.create({
        ratio: '16:9',
        highlightStyle: 'github',
        highlightLines: true,
        countIncrementalSlides: false,
        navigation: { scroll: false }
      });

      renderMathInElement(document.body, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ]
      });

      // Annotation system
      (function() {
        const canvas = document.getElementById('annotation-canvas');
        const ctx = canvas.getContext('2d');
        const indicator = document.getElementById('drawing-indicator');

        let isDrawing = false;
        let drawingMode = false;
        let lastX = 0;
        let lastY = 0;
        let currentSlideIdx = 0;
        let canvasDirty = false;

        const annotations = {};

        function setupCanvas() {
          const dpr = window.devicePixelRatio || 1;
          canvas.width = window.innerWidth * dpr;
          canvas.height = window.innerHeight * dpr;
          canvas.style.width = window.innerWidth + 'px';
          canvas.style.height = window.innerHeight + 'px';
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.scale(dpr, dpr);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#c62828';
        }

        function saveAnnotations() {
          if (canvasDirty) {
            annotations[currentSlideIdx] = canvas.toDataURL();
          }
        }

        function restoreAnnotations(slideIdx) {
          const dpr = window.devicePixelRatio || 1;
          canvas.width = window.innerWidth * dpr;
          canvas.height = window.innerHeight * dpr;
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.scale(dpr, dpr);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#c62828';
          canvasDirty = false;

          if (annotations[slideIdx]) {
            const img = new Image();
            const targetSlide = slideIdx;
            img.onload = function() {
              if (currentSlideIdx !== targetSlide) return;
              ctx.setTransform(1, 0, 0, 1, 0, 0);
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              ctx.scale(dpr, dpr);
            };
            img.src = annotations[slideIdx];
          }
        }

        function clearCurrentSlide() {
          const dpr = window.devicePixelRatio || 1;
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.scale(dpr, dpr);
          delete annotations[currentSlideIdx];
          canvasDirty = false;
        }

        function toggleDrawingMode() {
          drawingMode = !drawingMode;
          canvas.classList.toggle('drawing', drawingMode);
          indicator.classList.toggle('visible', drawingMode);
        }

        function getCoords(e) {
          if (e.touches && e.touches.length > 0) {
            return { x: e.touches[0].clientX, y: e.touches[0].clientY };
          }
          return { x: e.clientX, y: e.clientY };
        }

        function startDrawing(e) {
          if (!drawingMode) return;
          isDrawing = true;
          const coords = getCoords(e);
          lastX = coords.x;
          lastY = coords.y;
        }

        function draw(e) {
          if (!isDrawing || !drawingMode) return;
          e.preventDefault();
          const coords = getCoords(e);
          ctx.beginPath();
          ctx.moveTo(lastX, lastY);
          ctx.lineTo(coords.x, coords.y);
          ctx.stroke();
          lastX = coords.x;
          lastY = coords.y;
          canvasDirty = true;
        }

        function stopDrawing() {
          if (isDrawing) {
            isDrawing = false;
            saveAnnotations();
          }
        }

        function onHideSlide(slide) {
          saveAnnotations();
          if (isDrawing) {
            isDrawing = false;
          }
        }

        function onShowSlide(slide) {
          const newSlideIdx = slide ? slide.getSlideIndex() : slideshow.getCurrentSlideIndex();
          currentSlideIdx = newSlideIdx;
          restoreAnnotations(currentSlideIdx);
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        window.addEventListener('resize', function() {
          saveAnnotations();
          setupCanvas();
          restoreAnnotations(currentSlideIdx);
        });

        document.addEventListener('keydown', function(e) {
          if (e.key === 'd' || e.key === 'D') {
            toggleDrawingMode();
            e.stopPropagation();
          } else if ((e.key === 'x' || e.key === 'X') && drawingMode) {
            clearCurrentSlide();
            e.stopPropagation();
          }
        });

        function checkSlideChange() {
          const newIdx = slideshow.getCurrentSlideIndex();
          if (newIdx !== currentSlideIdx) {
            saveAnnotations();
            if (isDrawing) {
              isDrawing = false;
            }
            currentSlideIdx = newIdx;
            restoreAnnotations(currentSlideIdx);
          }
        }

        document.addEventListener('keyup', checkSlideChange);
        document.addEventListener('click', checkSlideChange);
        document.addEventListener('touchend', function(e) {
          setTimeout(checkSlideChange, 50);
        });

        slideshow.on('hideSlide', onHideSlide);
        slideshow.on('showSlide', onShowSlide);

        currentSlideIdx = slideshow.getCurrentSlideIndex();
        setupCanvas();
      })();

    </script>
  </body>
</html>
