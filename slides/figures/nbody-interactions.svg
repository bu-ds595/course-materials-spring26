<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 220">
  <defs>
    <marker id="force-arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#e53935"/>
    </marker>
    <marker id="vel-arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#888"/>
    </marker>
  </defs>

  <!-- 1-Body -->
  <g transform="translate(100, 95)">
    <!-- Body -->
    <circle cx="0" cy="0" r="20" fill="#5c6bc0" stroke="#3949ab" stroke-width="2"/>

    <!-- Mass label -->
    <text x="0" y="6" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="white" font-style="italic">m</text>

    <!-- Velocity arrow (dashed, showing free motion) -->
    <line x1="24" y1="0" x2="55" y2="0" stroke="#888" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#vel-arrow)"/>
    <text x="68" y="5" font-family="Inter, sans-serif" font-size="12" fill="#888" font-style="italic">v</text>

    <!-- Label -->
    <text x="0" y="70" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#333" font-weight="600">1 body</text>
    <text x="0" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#666">F = 0, trivial</text>
  </g>

  <!-- 2-Body -->
  <g transform="translate(300, 95)">
    <!-- Body 1 -->
    <circle cx="-50" cy="0" r="20" fill="#5c6bc0" stroke="#3949ab" stroke-width="2"/>
    <text x="-50" y="6" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="white" font-style="italic">m₁</text>

    <!-- Body 2 -->
    <circle cx="50" cy="0" r="16" fill="#ef5350" stroke="#c62828" stroke-width="2"/>
    <text x="50" y="5" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="white" font-style="italic">m₂</text>

    <!-- Force arrows (toward each other) -->
    <line x1="-28" y1="0" x2="-5" y2="0" stroke="#e53935" stroke-width="2" marker-end="url(#force-arrow)"/>
    <line x1="32" y1="0" x2="9" y2="0" stroke="#e53935" stroke-width="2" marker-end="url(#force-arrow)"/>

    <!-- Label -->
    <text x="0" y="65" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#333" font-weight="600">2 bodies</text>
    <text x="0" y="82" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#666">Keplerian</text>
    <text x="0" y="98" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#888" font-style="italic">r(θ) = a(1−e²) / (1+e cos θ)</text>
  </g>

  <!-- 3-Body -->
  <g transform="translate(550, 95)">
    <!-- Body 1 (top) -->
    <circle cx="0" cy="-45" r="18" fill="#5c6bc0" stroke="#3949ab" stroke-width="2"/>
    <text x="0" y="-40" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="white" font-style="italic">m₁</text>

    <!-- Body 2 (bottom left) -->
    <circle cx="-55" cy="35" r="15" fill="#ef5350" stroke="#c62828" stroke-width="2"/>
    <text x="-55" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="white" font-style="italic">m₂</text>

    <!-- Body 3 (bottom right) -->
    <circle cx="55" cy="35" r="13" fill="#66bb6a" stroke="#388e3c" stroke-width="2"/>
    <text x="55" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="white" font-style="italic">m₃</text>

    <!-- Forces on body 1 -->
    <line x1="-8" y1="-30" x2="-40" y2="15" stroke="#e53935" stroke-width="2" marker-end="url(#force-arrow)"/>
    <line x1="8" y1="-30" x2="40" y2="15" stroke="#e53935" stroke-width="2" marker-end="url(#force-arrow)"/>

    <!-- Forces on body 2 -->
    <line x1="-45" y1="22" x2="-12" y2="-22" stroke="#e53935" stroke-width="2" marker-end="url(#force-arrow)"/>
    <line x1="-38" y1="35" x2="30" y2="35" stroke="#e53935" stroke-width="2" marker-end="url(#force-arrow)"/>

    <!-- Forces on body 3 -->
    <line x1="45" y1="22" x2="12" y2="-22" stroke="#e53935" stroke-width="2" marker-end="url(#force-arrow)"/>
    <line x1="40" y1="35" x2="-28" y2="35" stroke="#e53935" stroke-width="2" marker-end="url(#force-arrow)"/>

    <!-- Label -->
    <text x="0" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#333" font-weight="600">3+ bodies</text>
    <text x="0" y="110" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#666">chaotic, no solution</text>
  </g>
</svg>